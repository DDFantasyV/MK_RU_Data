# 简洁版字段屏蔽词（手工维护，两页共用）
# 匹配规则（不区分大小写）：
#   - 普通行：字段路径任意一级的名称“包含”该词 → 隐藏该级及整棵子树；
#   - = 开头：任意一级名称与它“完全相等”才隐藏（用于 id / name 这类短词，
#     避免把 descIDs、valid 之类的名称误伤）。
# 空行和 # 开头的行忽略；文件缺失或加载失败时视为没有屏蔽词。
# 修改后刷新页面即生效，不需要重跑 build_history.py。
#
# 下面这一组是从 build_history.py 原有的噪音规则迁移过来的：
# 资源/特效词（子串）+ 内部 id、键名、装甲、非战舰系统的精确字段名。
# 想让某类参数重新出现在「版本变更」「历史变更」两页，删掉对应行即可。

smokePenalty
