<!doctype html>
<html lang="zh-CN" data-base="../" data-edition="simple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="逐舰回看《战舰世界》GameParams 参数在不同版本中的变化" data-i18n-content="逐舰回看《战舰世界》GameParams 参数在不同版本中的变化">
<title data-i18n="战舰历史变更 · Мир кораблей 数据变更">战舰历史变更 · Мир кораблей 数据变更</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1219'/%3E%3Cpath d='M12 5v9M7 9h10M4 15c2.5 2 5 3 8 3s5.5-1 8-3' stroke='%2357c8ff' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="history.css">
</head>
<body class="simple history">
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v11"/><path d="M7 8h10"/><path d="M4 15c2.5 2 5 3 8 3s5.5-1 8-3"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1 data-i18n-html="Мир кораблей <span>数据变更</span>">Мир кораблей <span>数据变更</span></h1>
      <p data-i18n-html="逐舰回看 <code>GameParams</code> 参数在不同版本中的变化">逐舰回看 <code>GameParams</code> 参数在不同版本中的变化</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="topbar-tools">
      <div class="view-switch" role="group" aria-label="页面视图" data-i18n-aria-label="页面视图">
        <a class="mode-btn" data-view="changes" href="index.html" data-i18n="版本变更">版本变更</a>
        <a class="mode-btn on" data-view="history" href="history.html" aria-current="page" data-i18n="历史变更">历史变更</a>
      </div>
      <div class="mode-switch" role="group" aria-label="版本模式" data-i18n-aria-label="版本模式">
        <a class="mode-btn" data-mode="pro" href="../index.html" data-i18n="专业版">专业版</a>
        <a class="mode-btn on" data-mode="simple" href="index.html" data-i18n="简洁版">简洁版</a>
      </div>
      <label class="lang-picker" title="切换语言" data-i18n-title="切换语言">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/>
        </svg>
        <select id="langSelect" aria-label="切换语言" data-i18n-aria-label="切换语言"></select>
      </label>
    </div>
  </div>
</header>

<main class="simple-layout history-layout">
  <aside class="simple-side history-side" aria-label="战舰列表" data-i18n-aria-label="战舰列表">
    <div class="side-head">
      <span data-i18n="战舰">战舰</span>
      <span class="muted" id="shipCount"></span>
    </div>
    <div class="side-search">
      <input id="shipSearch" type="search" placeholder="搜索战舰…" data-i18n-placeholder="搜索战舰…"
             aria-label="搜索战舰…" data-i18n-aria-label="搜索战舰…" autocomplete="off" spellcheck="false">
    </div>
    <div class="history-filters">
      <label>
        <span class="sr-only" data-i18n="国家">国家</span>
        <select id="nationFilter" aria-label="国家" data-i18n-aria-label="国家"></select>
      </label>
      <label>
        <span class="sr-only" data-i18n="舰种">舰种</span>
        <select id="typeFilter" aria-label="舰种" data-i18n-aria-label="舰种"></select>
      </label>
    </div>
    <div class="side-list" id="shipList">
      <div class="skeleton-list"></div>
    </div>
  </aside>

  <section class="simple-main history-main">
    <section class="simple-hero history-hero">
      <div class="pv-kicker" id="historyKicker"></div>
      <h2 class="pv-title" id="historyTitle"></h2>
      <div class="history-badges" id="historyBadges"></div>
      <p class="simple-sub" id="historySub"></p>
    </section>

    <div class="simple-chips" id="historyStats"></div>

    <div class="history-toolbar" id="historyToolbar" hidden>
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        <input id="paramSearch" type="search" placeholder="搜索参数路径 / 配件名…" data-i18n-placeholder="搜索参数路径 / 配件名…" autocomplete="off" spellcheck="false">
        <button class="clear" id="paramClear" hidden title="清空" data-i18n-title="清空">×</button>
      </div>
      <div class="history-actions">
        <button class="btn" id="expandAll" type="button" data-i18n="展开全部">展开全部</button>
        <button class="btn" id="collapseAll" type="button" data-i18n="收起全部">收起全部</button>
      </div>
    </div>

    <div class="history-note" id="historyNote"></div>
    <div class="history-scrollbar" id="historyScrollbar" hidden aria-hidden="true">
      <div id="historyScrollbarInner"></div>
    </div>
    <div class="empty-state" id="historyEmpty" hidden></div>
    <div class="history-scroll" id="historyScroll" hidden aria-label="参数时间线" data-i18n-aria-label="参数时间线">
      <div class="history-table" id="historyTable"></div>
    </div>
    <div class="simple-more" id="historyMore"></div>
  </section>
</main>

<footer class="footer">
  <span id="generatedAt"></span>
  <span class="dot">·</span>
  <span><span data-i18n="数据来源：">数据来源：</span><a href="https://github.com/DDFantasyV/MK_RU_Data" target="_blank" rel="noopener">https://github.com/DDFantasyV/MK_RU_Data</a></span>
</footer>

<script src="../assets/i18n.js"></script>
<script src="../assets/chrome.js"></script>
<script src="field-config.js"></script>
<script src="history.js"></script>
</body>
</html>
