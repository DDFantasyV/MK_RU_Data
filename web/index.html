    </div>
  </div>
  <div class="topbar-actions">
    <div class="topstats" id="topstats"></div>
    <div class="topbar-tools">
      <div class="mode-switch" role="group" aria-label="版本模式" data-i18n-aria-label="版本模式">
        <a class="mode-btn" data-mode="pro" href="index.html" data-i18n="专业版">专业版</a>

        </svg>
        <select id="langSelect" aria-label="切换语言" data-i18n-aria-label="切换语言"></select>

    </div>
  </div>

<div class="layout">

        <button type="button" data-ch="Live" role="tab"><span data-i18n="正式服 Live">正式服 Live</span><span class="n" id="chCountLive"></span></button>
      </div>
      <div id="periodList" class="period-list">
        <div class="skeleton-list"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
