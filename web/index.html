<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="战舰世界（Мир кораблей）GameParams 数据变更">
<title>Мир кораблей 数据变更</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230d1219'/%3E%3Cpath d='M12 5v9M7 9h10M4 15c2.5 2 5 3 8 3s5.5-1 8-3' stroke='%2357c8ff' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v11"/><path d="M7 8h10"/><path d="M4 15c2.5 2 5 3 8 3s5.5-1 8-3"/>
      </svg>
    </div>
    <div class="brand-text">
      <h1>Мир кораблей <span>数据变更</span></h1>
      <p>逐期对比 <code>GameParams.data</code> 的条目增删与字段改动</p>
    </div>
  </div>
  <div class="topstats" id="topstats"></div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="版本列表">
    <div class="sidebar-inner">
      <div class="panel-head">
        <span>版本 / 期次</span>
        <span class="muted" id="periodCount"></span>
      </div>
      <div class="channel-switch" id="channelSeg" role="tablist" aria-label="数据来源">
        <button type="button" data-ch="PT" class="on" role="tab">测试服 PT<span class="n" id="chCountPT"></span></button>
        <button type="button" data-ch="Live" role="tab">正式服 Live<span class="n" id="chCountLive"></span></button>
      </div>
      <div id="periodList" class="period-list">
        <div class="skeleton-list"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty-state" id="emptyState">
      <h2>正在载入数据…</h2>
      <p>如果长时间无响应，请确认通过 HTTP 服务访问本页（直接双击打开的 <code>file://</code> 页面可能被浏览器限制读取 JSON）。</p>
    </div>
    <div id="periodView" hidden></div>
  </main>
</div>

<footer class="footer">
  <span id="generatedAt"></span>
  <span class="dot">·</span>
  <span>数据来源：https://github.com/DDFantasyV/MK_RU_Data</span>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
