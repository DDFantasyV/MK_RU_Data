name: Deploy Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 仓库里 Live/ + PT/ 的拆包数据有 3 GB 左右，部署站点用不到，
      # 只检出 web/ 并跳过无关 blob，避免每次部署都拉整个仓库。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: web
          sparse-checkout-cone-mode: true
          filter: blob:none

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
